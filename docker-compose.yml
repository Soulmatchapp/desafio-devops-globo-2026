services:
  python-fixed-time-api:
    build: ./apps/python-fixed-time-api
    expose:
      - "8000"
    restart: unless-stopped

  go-fixed-time-api:
    build: ./apps/go-fixed-time-api
    expose:
      - "8080"
    restart: unless-stopped

  cache-reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - python-fixed-time-api
      - go-fixed-time-api
    restart: unless-stopped

  metrics-collector:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - python-fixed-time-api
      - go-fixed-time-api
    restart: unless-stopped

  metrics-dashboard:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/provisioning/dashboards/overview.json:/etc/grafana/provisioning/dashboards/overview.json:ro
    depends_on:
      - metrics-collector
    restart: unless-stopped
