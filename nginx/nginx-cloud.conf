# Cloud variant of the local nginx.conf: instead of proxying to Docker Compose
# service names, it proxies to the public Cloud Run URLs of python-fixed-time-api
# and go-fixed-time-api (from `terraform output`). This lets cache-reverse-proxy
# itself run as a third Cloud Run service and be the single public entrypoint,
# preserving the 10s/60s cache TTLs without needing a Load Balancer + custom domain.

proxy_cache_path /var/cache/nginx/python_fixed_time_api levels=1:2 keys_zone=python_api_cache_10s:10m max_size=100m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/go_fixed_time_api levels=1:2 keys_zone=go_api_cache_60s:10m max_size=100m inactive=10m use_temp_path=off;

# On Cloud Run, $remote_addr is Google's Front End, the same for every
# client -- rate-limiting on it would throttle everyone as one bucket. Use
# the real client IP (first hop of X-Forwarded-For, which Cloud Run's front
# end sets) as the rate-limit key instead.
map $http_x_forwarded_for $real_client_ip_for_rate_limit {
    ""                      $remote_addr;
    ~^(?<first_ip>[^,]+)    $first_ip;
}

# Anti-bot / anti-flood: caps each real client IP at 5 req/s (burst of 10
# absorbed without delay, e.g. a page load or a fast double-click),
# everything above that gets HTTP 429 instead of hammering the apps behind
# the cache.
limit_req_zone $real_client_ip_for_rate_limit zone=per_client_ip_rate_limit:10m rate=5r/s;
limit_req_status 429;

log_format cache_status '$remote_addr - [$time_local] "$request" $status '
                         'cache=$upstream_cache_status upstream_time=$upstream_response_time';

server {
    listen 8080;

    access_log /var/log/nginx/access.log cache_status;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        limit_req zone=per_client_ip_rate_limit burst=10 nodelay;
        try_files /index.html =404;
    }

    # Python app -- cached for 10 seconds (python_api_cache_10s zone)
    location /python-api/ {
        limit_req zone=per_client_ip_rate_limit burst=10 nodelay;
        proxy_pass https://python-fixed-time-api-j466jqnteq-rj.a.run.app/;
        proxy_ssl_server_name on;
        proxy_set_header Host python-fixed-time-api-j466jqnteq-rj.a.run.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache python_api_cache_10s;
        proxy_cache_valid 200 10s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Go app -- cached for 1 minute (go_api_cache_60s zone)
    location /go-api/ {
        limit_req zone=per_client_ip_rate_limit burst=10 nodelay;
        proxy_pass https://go-fixed-time-api-j466jqnteq-rj.a.run.app/;
        proxy_ssl_server_name on;
        proxy_set_header Host go-fixed-time-api-j466jqnteq-rj.a.run.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache go_api_cache_60s;
        proxy_cache_valid 200 60s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
    }

    location = /healthz {
        return 200 '{"status":"ok"}';
        default_type application/json;
    }
}
