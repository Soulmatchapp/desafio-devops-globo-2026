<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio DevOps 2026 — Globo</title>
<style>
  :root {
    --globo-blue: #0b3d91;
    --globo-blue-dark: #06265c;
    --accent: #ffb703;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--globo-blue) 0%, var(--globo-blue-dark) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    padding: 24px;
  }

  main {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  #globeSymbol {
    font-size: 64px;
    display: inline-block;
    animation: spinGlobeSymbol 6s linear infinite;
  }

  @keyframes spinGlobeSymbol {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  h1 {
    margin: 12px 0 4px;
    font-size: 22px;
    color: var(--globo-blue);
  }

  #authorName {
    margin: 0 0 24px;
    font-size: 15px;
    color: #555;
  }

  #cacheDemoButton {
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  #cacheDemoButton:hover {
    transform: scale(1.05);
  }

  #cacheDemoButton:active {
    transform: scale(0.95);
  }

  #cacheDemoResultArea {
    margin-top: 24px;
    text-align: left;
    display: none;
  }

  .cache-demo-result-card {
    background: #f4f6fb;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 14px;
  }

  .cache-demo-result-card strong {
    color: var(--globo-blue);
  }

  .cache-status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: white;
  }

  .cache-status-hit { background: #2a9d8f; }
  .cache-status-miss, .cache-status-expired { background: #e76f51; }

  #cacheDemoCaption {
    margin-top: 4px;
    font-size: 14px;
    font-style: italic;
    color: #555;
  }

  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <main>
    <span id="globeSymbol">🌐</span>
    <h1>Desafio DevOps 2026 — Globo</h1>
    <p id="authorName">por Cassio Henrique Silva</p>

    <button id="cacheDemoButton" onclick="runCacheDemo()">🚀 Aperta aqui (sem medo)</button>

    <div id="cacheDemoResultArea">
      <div class="cache-demo-result-card" id="pythonApiResultCard"></div>
      <div class="cache-demo-result-card" id="goApiResultCard"></div>
      <p id="cacheDemoCaption"></p>
    </div>

    <footer>python-fixed-time-api (cache 10s) · go-fixed-time-api (cache 60s)</footer>
  </main>

<script>
  var funnyCaptionsForCacheHit = [
    "😎 Cache quentinho, nem suou pra responder.",
    "🔥 Isso ali nem chegou a acordar o servidor.",
    "🛋️ O servidor tava deitado e nem precisou levantar."
  ];

  var funnyCaptionsForCacheMiss = [
    "🥶 Cache gelado, foi buscar na fonte agora.",
    "🏃 Correu até o servidor e voltou correndo.",
    "🍳 Fresquinho, saiu do forno agora mesmo."
  ];

  function pickRandomFunnyCaption(captionList) {
    return captionList[Math.floor(Math.random() * captionList.length)];
  }

  function renderCacheDemoResultCard(cardElementId, appLabel, cacheTtlLabel, jsonBody, cacheStatusHeader) {
    var normalizedCacheStatus = (cacheStatusHeader || "MISS").toUpperCase();
    var badgeClass = normalizedCacheStatus === "HIT" ? "cache-status-hit" : "cache-status-miss";
    document.getElementById(cardElementId).innerHTML =
      "<strong>" + appLabel + "</strong> (cache " + cacheTtlLabel + ") " +
      "<span class=\"cache-status-badge " + badgeClass + "\">" + normalizedCacheStatus + "</span>" +
      "<br>" + jsonBody.message +
      "<br><small>" + jsonBody.server_time + "</small>";
    return normalizedCacheStatus;
  }

  function runCacheDemo() {
    var resultArea = document.getElementById("cacheDemoResultArea");
    resultArea.style.display = "block";
    document.getElementById("pythonApiResultCard").textContent = "Buscando...";
    document.getElementById("goApiResultCard").textContent = "Buscando...";

    Promise.all([
      fetch("/python-api/fixed").then(function (r) {
        return r.json().then(function (fixedBody) {
          return fetch("/python-api/time").then(function (timeResponse) {
            return timeResponse.json().then(function (timeBody) {
              return renderCacheDemoResultCard(
                "pythonApiResultCard", "python-fixed-time-api", "10s",
                { message: fixedBody.message, server_time: timeBody.server_time },
                timeResponse.headers.get("x-cache-status")
              );
            });
          });
        });
      }),
      fetch("/go-api/fixed").then(function (r) {
        return r.json().then(function (fixedBody) {
          return fetch("/go-api/time").then(function (timeResponse) {
            return timeResponse.json().then(function (timeBody) {
              return renderCacheDemoResultCard(
                "goApiResultCard", "go-fixed-time-api", "60s",
                { message: fixedBody.message, server_time: timeBody.server_time },
                timeResponse.headers.get("x-cache-status")
              );
            });
          });
        });
      })
    ]).then(function (cacheStatuses) {
      var anyCacheHit = cacheStatuses.indexOf("HIT") !== -1;
      var captionPool = anyCacheHit ? funnyCaptionsForCacheHit : funnyCaptionsForCacheMiss;
      document.getElementById("cacheDemoCaption").textContent = pickRandomFunnyCaption(captionPool);
    }).catch(function (error) {
      document.getElementById("cacheDemoCaption").textContent = "😬 Deu ruim: " + error;
    });
  }
</script>
</body>
</html>
