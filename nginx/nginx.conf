proxy_cache_path /var/cache/nginx/py levels=1:2 keys_zone=py_cache:10m max_size=100m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/go levels=1:2 keys_zone=go_cache:10m max_size=100m inactive=10m use_temp_path=off;

log_format cache_status '$remote_addr - [$time_local] "$request" $status '
                         'cache=$upstream_cache_status upstream_time=$upstream_response_time';

upstream py_service {
    server py-service:8000;
}

upstream go_service {
    server go-service:8080;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log cache_status;

    # Python app -- cached for 10 seconds
    location /py/ {
        proxy_pass http://py_service/;
        proxy_cache py_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Go app -- cached for 1 minute
    location /go/ {
        proxy_pass http://go_service/;
        proxy_cache go_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
    }

    location = /healthz {
        return 200 '{"status":"ok"}';
        default_type application/json;
    }
}
