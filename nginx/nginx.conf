proxy_cache_path /var/cache/nginx/python_fixed_time_api levels=1:2 keys_zone=python_api_cache_10s:10m max_size=100m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/go_fixed_time_api levels=1:2 keys_zone=go_api_cache_60s:10m max_size=100m inactive=10m use_temp_path=off;

log_format cache_status '$remote_addr - [$time_local] "$request" $status '
                         'cache=$upstream_cache_status upstream_time=$upstream_response_time';

upstream python_fixed_time_api {
    server python-fixed-time-api:8000;
}

upstream go_fixed_time_api {
    server go-fixed-time-api:8080;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log cache_status;

    root /usr/share/nginx/html;
    index index.html;

    # Python app -- cached for 10 seconds (python_api_cache_10s zone)
    location /python-api/ {
        proxy_pass http://python_fixed_time_api/;
        proxy_cache python_api_cache_10s;
        proxy_cache_valid 200 10s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Go app -- cached for 1 minute (go_api_cache_60s zone)
    location /go-api/ {
        proxy_pass http://go_fixed_time_api/;
        proxy_cache go_api_cache_60s;
        proxy_cache_valid 200 60s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
    }

    location = /healthz {
        return 200 '{"status":"ok"}';
        default_type application/json;
    }
}
