<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>go-fixed-time-api — Globo</title>
<style>
  :root {
    --globo-blue: #0b3d91;
    --globo-blue-dark: #06265c;
    --accent: #ffb703;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--globo-blue) 0%, var(--globo-blue-dark) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    padding: 24px;
  }

  main {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  #appSymbol {
    font-size: 64px;
    display: inline-block;
    animation: bounceAppSymbol 1.6s ease-in-out infinite;
  }

  @keyframes bounceAppSymbol {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  h1 {
    margin: 12px 0 4px;
    font-size: 20px;
    color: var(--globo-blue);
  }

  #authorName {
    margin: 0 0 24px;
    font-size: 15px;
    color: #555;
  }

  #fixedTimeDemoButton {
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  #fixedTimeDemoButton:hover { transform: scale(1.05); }
  #fixedTimeDemoButton:active { transform: scale(0.95); }

  #fixedTimeResultCard {
    margin-top: 20px;
    background: #f4f6fb;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    display: none;
    text-align: left;
  }

  #fixedTimeResultCard strong { color: var(--globo-blue); }

  #fixedTimeDemoCaption {
    margin-top: 12px;
    font-size: 13px;
    font-style: italic;
    color: #555;
  }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <main>
    <span id="appSymbol">⚡</span>
    <h1>go-fixed-time-api</h1>
    <p id="authorName">Desafio DevOps 2026 — Globo · por Cassio Henrique Silva</p>

    <button id="fixedTimeDemoButton" onclick="runFixedTimeDemo()">⚡ Aperta que é rapidinho</button>

    <div id="fixedTimeResultCard"></div>
    <p id="fixedTimeDemoCaption"></p>

    <footer>Cache de 60s? Passa pelo <code>cache-reverse-proxy</code> em <code>/go-api/time</code>.</footer>
  </main>

<script>
  var funnyCaptionsForFixedTimeDemo = [
    "⚡ Compilado e servido antes de você piscar.",
    "⚡ Go não perde tempo com isso.",
    "⚡ Sem garbage collector de desculpa, respondeu na hora."
  ];

  function pickRandomFunnyCaption(captionList) {
    return captionList[Math.floor(Math.random() * captionList.length)];
  }

  function runFixedTimeDemo() {
    var resultCard = document.getElementById("fixedTimeResultCard");
    resultCard.style.display = "block";
    resultCard.textContent = "Buscando...";

    Promise.all([
      fetch("/fixed").then(function (r) { return r.json(); }),
      fetch("/time").then(function (r) { return r.json(); })
    ]).then(function (results) {
      var fixedBody = results[0];
      var timeBody = results[1];
      resultCard.innerHTML =
        "<strong>" + fixedBody.message + "</strong>" +
        "<br><small>" + timeBody.server_time + "</small>";
      document.getElementById("fixedTimeDemoCaption").textContent =
        pickRandomFunnyCaption(funnyCaptionsForFixedTimeDemo);
    }).catch(function (error) {
      resultCard.textContent = "😬 Deu ruim: " + error;
    });
  }
</script>
</body>
</html>
